<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reception · Test chat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#0D0D0D;--silver:#C2C2C2;--silver-light:#E0E0E0;--silver-dark:#888;--green:#4CAF6E;--blue:#6495ED;}
  body{font-family:'Outfit',system-ui,sans-serif;background:var(--ink);color:var(--silver-light);min-height:100vh;display:flex;flex-direction:column;align-items:center;}
  .wrap{width:100%;max-width:480px;height:100vh;display:flex;flex-direction:column;}
  .head{padding:14px 18px;border-bottom:.5px solid rgba(194,194,194,.15);background:rgba(20,20,20,.95);display:flex;align-items:center;gap:12px;position:sticky;top:0;}
  .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#2a2a2a,#3a3a3a);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:18px;color:var(--silver);}
  .head h1{font-family:'Fraunces',serif;font-weight:400;font-size:16px;}
  .head .sub{font-size:11px;color:var(--green);display:flex;align-items:center;gap:5px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
  select{margin-left:auto;background:rgba(194,194,194,.08);border:.5px solid rgba(194,194,194,.2);border-radius:16px;color:var(--silver);padding:5px 10px;font-size:11px;font-family:inherit;outline:none;}
  select option{background:#1a1a1a;}
  .stream{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px;}
  .bubble{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;}
  .them{align-self:flex-start;background:rgba(255,255,255,.07);border:.5px solid rgba(194,194,194,.12);border-bottom-left-radius:5px;}
  .me{align-self:flex-end;background:#055d4a;color:#eafff7;border-bottom-right-radius:5px;}
  .tag{align-self:center;font-size:10px;color:var(--silver-dark);letter-spacing:.05em;text-transform:uppercase;padding:4px 0;}
  .typing{align-self:flex-start;color:var(--silver-dark);font-size:13px;font-style:italic;padding:4px 8px;}
  .composer{display:flex;gap:8px;padding:12px 14px;border-top:.5px solid rgba(194,194,194,.15);background:rgba(20,20,20,.95);}
  .composer input{flex:1;background:rgba(194,194,194,.07);border:.5px solid rgba(194,194,194,.2);border-radius:20px;padding:11px 16px;color:var(--silver-light);font-size:16px;font-family:inherit;outline:none;}
  .composer input:focus{border-color:rgba(194,194,194,.4);}
  .composer button{background:var(--green);border:none;border-radius:50%;width:42px;height:42px;color:#06210f;font-size:18px;cursor:pointer;flex-shrink:0;}
  .composer button:disabled{opacity:.4;cursor:default;}
  .hint{text-align:center;font-size:11px;color:var(--silver-dark);padding:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="avatar" id="ava">B</div>
    <div>
      <h1 id="bizname">Loading…</h1>
      <div class="sub"><span class="dot"></span> Typically replies instantly</div>
    </div>
    <select id="tenant" title="Which client receptionist to test"></select>
  </div>
  <div class="stream" id="stream"></div>
  <div class="composer">
    <input id="msg" placeholder="Type a message…" autocomplete="off">
    <button id="send">↑</button>
  </div>
  <div class="hint">Simulator — you are playing a customer messaging this client's AI receptionist.</div>
</div>
<script>
const stream = document.getElementById('stream');
const sel = document.getElementById('tenant');
let session = Math.random().toString(36).slice(2,10);

function add(text, cls){ const d=document.createElement('div'); d.className='bubble '+cls; d.textContent=text; stream.appendChild(d); stream.scrollTop=stream.scrollHeight; return d; }
function tag(t){ const d=document.createElement('div'); d.className='tag'; d.textContent=t; stream.appendChild(d); }

async function loadTenants(){
  const ts = await fetch('/api/tenants').then(r=>r.json());
  sel.innerHTML = ts.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
  pickTenant();
}
function pickTenant(){
  const id = sel.value; session = Math.random().toString(36).slice(2,10); stream.innerHTML='';
  const name = sel.options[sel.selectedIndex].text;
  document.getElementById('bizname').textContent = name;
  document.getElementById('ava').textContent = name[0]||'R';
  tag('New conversation · '+name);
}
sel.onchange = pickTenant;

async function send(){
  const input = document.getElementById('msg');
  const text = input.value.trim(); if(!text) return;
  input.value=''; add(text,'me');
  const typing = document.createElement('div'); typing.className='typing'; typing.textContent='typing…'; stream.appendChild(typing); stream.scrollTop=stream.scrollHeight;
  try{
    const r = await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({tenant_id:sel.value,session,text})}).then(r=>r.json());
    typing.remove();
    if(r.error){ add('⚠ '+r.error,'them'); return; }
    add(r.reply,'them');
    if(r.status && r.status!=='active') tag('status: '+r.status);
  }catch(e){ typing.remove(); add('⚠ '+e.message,'them'); }
}
document.getElementById('send').onclick = send;
document.getElementById('msg').addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
loadTenants();
</script>
</body>
</html>
